<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Bahasa Arab</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#2b2350;--card:#fff;--p:#7c4dff;--g:#2ecc71;--r:#ff5252;--y:#ffc400}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#ffd86f,#ff9a8b 45%,#a18cff);min-height:100vh;background-attachment:fixed}
.ar{font-family:'Amiri','Noto Naskh Arabic',serif;direction:rtl}
#app{max-width:520px;margin:0 auto;padding:14px}
.hud{display:flex;justify-content:space-between;align-items:center;background:#fff9;border-radius:18px;padding:8px 14px;font-weight:800;font-size:18px;backdrop-filter:blur(6px)}
h1{font-size:34px;line-height:1;margin:10px 0 2px;text-align:center;color:#fff;text-shadow:0 3px 0 #5b2fd6}
.sub{text-align:center;color:#fff;font-weight:700;margin:0 0 12px;text-shadow:0 1px 0 #0003}
.owl{font-size:84px;text-align:center;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:0;border-radius:22px;padding:16px 8px;color:#fff;font:inherit;font-weight:800;font-size:17px;box-shadow:0 6px 0 #0003;cursor:pointer;transition:.1s}
.mode:active{transform:translateY(5px);box-shadow:0 1px 0 #0003}
.mode span{display:block;font-size:44px}
.mode small{display:block;font-weight:500;font-size:13px;opacity:.95}
.card{background:var(--card);border-radius:26px;padding:18px;margin-top:12px;box-shadow:0 8px 0 #0002;text-align:center}
.bar{height:14px;background:#fff6;border-radius:9px;margin:10px 0;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2ecc71,#a6ff4d);width:0;transition:.4s;border-radius:9px}
.q{font-size:20px;font-weight:700}
.big{font-size:92px;line-height:1.1}
.bigar{font-size:64px;line-height:1.5;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{border:3px solid #e3dcff;background:#faf8ff;border-radius:18px;padding:10px;font:inherit;font-size:44px;cursor:pointer;color:var(--ink);box-shadow:0 4px 0 #cfc4ff;min-height:76px}
.opt.ar{font-size:36px}
.opt:active{transform:translateY(3px)}
.opt.ok{background:#c9f7d8;border-color:var(--g);animation:pop .4s}
.opt.no{background:#ffd6d6;border-color:var(--r);animation:shake .4s}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{min-height:54px;margin-top:10px;font-weight:800;font-size:18px}
.btn{border:0;border-radius:18px;background:var(--p);color:#fff;font:inherit;font-weight:800;font-size:20px;padding:10px 26px;box-shadow:0 5px 0 #4a2bb5;cursor:pointer;margin-top:8px}
.btn.alt{background:#fff;color:var(--p);box-shadow:0 5px 0 #cfc4ff}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.tile{aspect-ratio:1;perspective:600px;border:0;background:none;padding:0;cursor:pointer}
.tile div{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.tile.f div{transform:rotateY(180deg)}
.tile b,.tile u{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:16px;backface-visibility:hidden;text-decoration:none;box-shadow:0 4px 0 #0003}
.tile b{background:linear-gradient(135deg,#7c4dff,#ff6ec7);color:#fff;font-size:34px}
.tile u{background:#fff;transform:rotateY(180deg);font-size:46px}
.tile u.ar{font-size:30px;font-weight:700;direction:rtl}
.tile.m u{background:#c9f7d8}
.stars{font-size:54px}
.conf{position:fixed;top:-40px;font-size:28px;animation:fall 2.2s linear forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.opt.sm{font-size:16px;font-weight:700;line-height:1.2}.lv{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:12px 14px;margin-top:12px;box-shadow:0 6px 0 #0002;border:0;width:100%;font:inherit;color:var(--ink);text-align:left;cursor:pointer}.lv.lock{opacity:.55;filter:grayscale(.8)}.lv span{font-size:42px}.lv b{font-size:19px}.far{font-size:30px;opacity:.9}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="app"></div>

else if(m=="arti"){const s=sh(S)[0];q=`<div class="q">Apa arti kalimat ini?</div><div class="bigar ar" style="font-size:36px">${s[0].replace("___",`<span style='color:#7c4dff'>${s[1]}</span>`)}</div>`;
 opts=sh([s,...sh(S.filter(x=>x!==s)).slice(0,3)]).map(x=>[x[2],x===s,2]);hint=s[2]}
else{const s=sh(S)[0];q=`<div class="q">Lengkapi kalimatnya!</div><div class="bigar ar" style="font-size:38px">${s[0].replace("___","<span style='color:#7c4dff'>＿＿</span>")}</div>`;
 opts=sh(["في","على","من","إلى"]).map(x=>[x,x==s[1],1]);hint=s[2]}
st.cur={hint};
app.innerHTML=`${hud()}<div class="bar"><i style="width:${st.n/T()*100}%"></i></div><div class="card">${q}<div class="opts">${opts.map((o,i)=>`<button class="opt ${o[2]==1?"ar":o[2]==2?"sm":""}" data-ok="${o[1]}" onclick="pick(this)">${o[0]}</button>`).join("")}</div><div class="fb" id="fb"></div></div>`}
function pick(b){const ok=b.dataset.ok=="true",fb=document.getElementById("fb");document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.ok=="true")x.classList.add("ok")});
if(ok){st.streak++;st.ok++;st.xp+=10+(st.streak>2?5:0);snd(660);snd(880,.2);fb.innerHTML=`🎉 Mantap! +${10+(st.streak>2?5:0)} XP<br><small class="ar">${st.cur.hint}</small>`;if(st.streak%3==0)conf()}
else{b.classList.add("no");st.streak=0;st.hp--;snd(200,.3,"sawtooth");fb.innerHTML=`😅 Hampir! Yang benar:<br><small class="ar">${st.cur.hint}</small>`}
st.n++;fb.innerHTML+=`<br><button class="btn" onclick="next()">Lanjut ➜</button>`;
document.querySelector(".hud").outerHTML=hud()}
function end(){const win=st.hp>0,r=st.ok/T(),stars=!win?0:r>=.9?3:r>=.7?2:1;const L=st.lv,king=L==25&&win;if(L&&stars>PR[L-1]){PR[L-1]=stars;try{localStorage.setItem("lvpr",JSON.stringify(PR))}catch(e){}}if(st.xp>st.best){st.best=st.xp;try{localStorage.setItem("bestxp",st.best)}catch(e){}}

let mm;
function mem(){const w=sh(W).slice(0,6),t=[];w.forEach((x,i)=>{t.push({id:i,h:`<u class="ar">${x[0]}</u>`});t.push({id:i,h:`<u>${x[2]}</u>`})});mm={t:sh(t),open:[],moves:0,done:0,lock:false};

function flip(i,el){if(mm.lock||el.classList.contains("f"))return;el.classList.add("f");snd(500,.08);mm.open.push([i,el]);if(mm.open.length<2)return;
mm.moves++;document.getElementById("mv").textContent="Langkah: "+mm.moves;const[a,b]=mm.open;mm.open=[];
if(mm.t[a[0]].id==mm.t[b[0]].id){a[1].classList.add("m");b[1].classList.add("m");snd(880,.2);if(++mm.done==6){st.xp=Math.max(10,120-mm.moves*5);st.ok=mm.moves<=9?8:mm.moves<=13?6:4;st.hp=1;setTimeout(end,900)}}
else{mm.lock=true;snd(220,.2,"square");setTimeout(()=>{a[1].classList.remove("f");b[1].classList.remove("f");mm.lock=false},800)}}
